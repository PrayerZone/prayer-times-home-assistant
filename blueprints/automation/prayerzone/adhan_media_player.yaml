blueprint:
  name: PrayerZone - play adhan at the next prayer
  description: Play an adhan URL on a selected media player at the next PrayerZone prayer.
  domain: automation
  input:
    next_prayer:
      name: Next prayer timestamp
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    media_player:
      name: Media player
      selector:
        entity:
          domain: media_player
    adhan_url:
      name: Adhan media URL
      description: A URL reachable by the media player.
      selector:
        text:

trigger:
  - platform: time
    at: !input next_prayer
action:
  - service: media_player.play_media
    target:
      entity_id: !input media_player
    data:
      media_content_id: !input adhan_url
      media_content_type: music
mode: single
